[tool.poetry]
name = "thelonious"
version = "0.1.0"
description = "CLI tool that offers a set of exercices for practicing piano voicings for chords, chord prerages MIDI controller for reading the answer to the exercices and fluidsynth for playing sounds and backing tracks."
authors = ["Pau R. Esmerats <presmerats@gmail.com>"]
license = "GNU GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
mingus = "0.6.1"
mido = "1.2.9"
py-picotts = "0.1.2"
pyfluidsynth = "^1.3.4"
pyaudio = "^0.2.14"
python-rtmidi = "^1.5.8"
click = "^8.1.8"
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
mypy = "^1.14.1"
pre-commit = "^4.0.1"
ruff = "^0.8.6"
types-pyyaml = "^6.0.12.20241230"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]
ignore = [
    "E501",  # line-too-long
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
