[tool.poetry]
name = "midi-harmony-trainer"
version = "0.1.0"
description = "CLI tool that offers a set of exercices for practicing piano voicings for chords, chord prerages MIDI controller for reading the answer to the exercices and fluidsynth for playing sounds and backing tracks."
authors = ["Pau R. Esmerats <presmerats@gmail.com>"]
license = "GNU GPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
mingus = "0.6.1"
mido = "1.2.9"
py-picotts = "0.1.2"
pyfluidsynth = "^1.3.4"
pyaudio = "^0.2.14"
python-rtmidi = "^1.5.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
